services:
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${MAIN_DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
