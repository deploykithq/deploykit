# Plain Compose. Placeholders here are Compose's own interpolation, fed by the
# .env file DeployKit writes next to this one from the blueprint's resolved
# `env`. DeployKit's generator syntax lives only in template.json.
services:
  n8n:
    image: n8nio/n8n:1.70.0
    restart: unless-stopped
    # `expose`, not `ports`: the stack is reached through Traefik on the shared
    # network, so publishing a host port would only invite collisions.
    expose:
      - "5678"
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_HOST: ${N8N_HOST}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-data:
